{% extends "base.html" %}

{% block title %}Writing Page{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/writing.css') }}">
{% endblock %}

{% block content %}
    <form action="{{ request.path }}" method="post" enctype="multipart/form-data">
        <div class="header">
            
            <label for="entry_date">Date</label>
            <input type="date" id="entry_date" name="entry_date" value="{{ session.get('date', session.get('selected_date', '')) }}">
            
            <label for="place">Place</label>
            <input type="text" id="place" name="place" placeholder="Enter place..." value="{{ session.get('place', '') }}">
        </div>
        
        <div class="images-section">
            <h3>Add Images</h3>
            <div id="preview-container">
                {% if images %}
                    {% for image in images %}
                        <div class="image-preview">
                            <img src="{{ url_for('tasks.uploaded_file', filename=image) }}" alt="Image Preview">
                            <button type="button" class="remove-image">X</button>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>
        </div>
        
        <div class="text-section">
            <textarea id="My_text_area" name="text_content" placeholder="Start writing...">{{ text }}</textarea>
        </div>
        
        <button type="submit" class="floating-btn">
            <i class="fa-solid fa-check"></i>
        </button>
        <div class="camera"><i class="fa-solid fa-camera"></i></div>
        <input type="file" name="image_file" id="image" accept="image/*" multiple hidden>
        <input type="hidden" name="filename" id="filename-input">
    </form>
    
    <div id="filename-modal" class="modal">
        <div class="modal-content">
            <h3>Enter Filename (optional)</h3>
            <input type="text" id="filename-field" placeholder="e.g., my_entry.txt">
            <button class="submit-btn" id="modal-submit">Save</button>
            <button class="cancel-btn" id="modal-cancel">Cancel</button>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script>
        const camera = document.querySelector('.camera');
        const imageInput = document.querySelector('#image');
        const previewContainer = document.querySelector('#preview-container');

        camera.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', (event) => {
            for (const file of event.target.files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.createElement('div');
                    preview.classList.add('image-preview');
                    
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    
                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.classList.add('remove-image');
                    removeBtn.innerHTML = 'X';
                    
                    removeBtn.addEventListener('click', () => {
                        preview.remove();
                    });
                    
                    preview.appendChild(img);
                    preview.appendChild(removeBtn);
                    previewContainer.appendChild(preview);
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission
        const form = document.querySelector('form');
        const modal = document.getElementById('filename-modal');
        const filenameField = document.getElementById('filename-field');
        const modalSubmit = document.getElementById('modal-submit');
        const modalCancel = document.getElementById('modal-cancel');
        const filenameInput = document.getElementById('filename-input');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            modal.style.display = 'flex';
        });

        modalSubmit.addEventListener('click', () => {
            const filename = filenameField.value.trim();
            filenameInput.value = filename || '';
            modal.style.display = 'none';
            form.submit();
        });

        modalCancel.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Close modal if clicked outside
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
{% endblock %}
