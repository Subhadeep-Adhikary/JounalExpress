<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — DiaryHub</title>
    <style>
        :root{
	--pink: #ff9bb3;
	--red: #ff4d6d;
	--peach: #ffdfe6;
	--card-bg: rgba(255,255,255,0.12);
}

*{box-sizing: border-box;margin:0;padding:0}
html,body{height:100%}
body{
	min-height:100vh;
	display:flex;
	align-items:center;
	justify-content:center;
	background: linear-gradient(135deg,var(--peach), #fff);
	font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
	padding:20px;
}

.login-card{
	width:360px;
	max-width:96%;
	padding:32px;
	border-radius:20px;
	background: linear-gradient(180deg,var(--red),var(--pink));
	color:#fff;
	box-shadow: 0 12px 40px rgba(0,0,0,0.18);
	position:relative;
	overflow:hidden;
}

.logo{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.logo .brand{font-size:22px;font-weight:700;letter-spacing:0.4px}
.logo .heart{font-size:30px;transform:rotate(-12deg)}

.subtitle{opacity:0.95;margin-bottom:18px;font-size:14px}

.form-group{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.input{
	background: var(--card-bg);
	border: none;
	padding:12px 14px;
	border-radius:12px;
	color: #fff;
	outline: none;
	font-size:14px;
}
.input::placeholder{color: rgba(255,255,255,0.85)}

.btn{
	width:100%;
	padding:12px;
	border-radius:12px;
	border:none;
	background: #fff;
	color: #80132a;
	font-weight:600;
	cursor:pointer;
	box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.btn.alt{
	background: rgba(255,255,255,0.12);
	color:#fff;
	border: 1px solid rgba(255,255,255,0.14);
}

.alt-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.footer-links{margin-top:14px;text-align:center;font-size:13px}
.footer-links a{color:rgba(255,255,255,0.95);text-decoration:underline}

/* small sparkle bubble decorations */
.bubble{position:absolute;border-radius:50%;opacity:0.12}
.b1{width:140px;height:140px;background:#fff;top:-40px;right:-40px}
.b2{width:80px;height:80px;background:#ffd6e0;bottom:-30px;left:-30px}

@media (max-width:420px){
	.login-card{padding:22px;border-radius:16px}
}
    </style>
    
</head>
<body>
    <main class="login-card">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>

        <header class="logo">
            <div class="heart">💗</div>
            <div>
                <div class="brand">DiaryHub</div>
                <div class="subtitle">Write the stories your heart remembers</div>
            </div>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="post">
            <div class="form-group">
                <input class="input" type="email" name="email" placeholder="Your email" required>
                <input class="input" type="password" name="password" placeholder="Password" required>
            </div>

            <button class="btn" type="submit">Sign in</button>

            <button class="btn alt" type="button">Sign in with Google</button>

            <div class="alt-actions">
                <label class="small"><input type="checkbox" name="remember"> Remember me</label>
                <a class="small link" href="#">Forgot?</a>
            </div>
        </form>

        <div class="footer-links">
            <div class="small">Don't have an account? <a class="link" href="{{ url_for('auth.register') }}">Sign up</a></div>
            <div class="small"><a class="link" href="{{ url_for('tasks.view') }}">Skip for now</a></div>
        </div>
    </main>
</body>
</html>
