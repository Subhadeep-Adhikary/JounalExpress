{% extends "base.html" %}

{% block title %}{{ name }}{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
    <div class="read-container">
        <div class="file-header">
            <a class="download-top-right" href="{{ download_url or url_for('tasks.download_file_pdf', filename=name) }}">
                <i class="fa-solid fa-download"></i> Download PDF
            </a>
            <h1>{{ name }}</h1>
            <div class="file-meta">
                <span><i class="fa-solid fa-calendar-days"></i> {{ date }}</span>
                <span><i class="fa-solid fa-location-dot"></i> {{ place }}</span>
            </div>
        </div>

        {% if images %}
        <div class="file-images">
            <h3>Images</h3>
            <div class="image-gallery">
                {% for image in images %}
                    <img src="{{ url_for('tasks.uploaded_file', filename=image) }}" alt="Image">
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <div class="file-content">
            <p>{{ content }}</p>
        </div>

    </div>
{% endblock %}
